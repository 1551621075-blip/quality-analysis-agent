[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quality-analysis-agent"
version = "0.1.0"
description = "Original synthetic quality investigation with bounded agentic RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "httpx>=0.28",
  "langgraph==1.2.5", "numpy>=2.0", "scipy>=1.14", "sqlglot>=26",
  "pypdf>=5", "typer>=0.15", "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
quality = "quality_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
